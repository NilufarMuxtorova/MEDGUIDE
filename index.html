<script>
    // 1. Matnni ovoz chiqarib o'qish funksiyasi
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'la-LA'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Afsuski, brauzeringiz ovoz chiqarish funksiyasini qo'llab-quvvatlamaydi.");
        }
    }

    // 2. QR kod orqali kirganda faqat bitta kartochkani ko'rsatish
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash; // Masalan: #ost-5
        
        if (hash) {
            const allCards = document.querySelectorAll('.card');
            
            // Hamma kartochkalarni yashiramiz
            allCards.forEach(card => {
                card.style.display = 'none';
            });

            // Faqat kerakli kartochkani topib chiqaramiz
            const targetCard = document.querySelector(hash);
            if (targetCard) {
                targetCard.style.display = 'block';
            }
        }
    });
</script>
